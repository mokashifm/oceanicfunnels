<!-- Oceanic Funnels checkout: slim header + order form styling. Paste into the Custom Code block at the top of the checkout page. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--of-ink:#06223a;--of-ink2:#0b3556;--of-aqua:#14c8c8;--of-aqua2:#0fa9b0;--of-line:#dbe6ee;--of-soft:#f3f8fb;--of-mut:#5b7186}
body{background:linear-gradient(180deg,#e6f5f7 0,#f6fafc 460px,#f6fafc 100%)!important}

/* slim header */
.ofh{font-family:Inter,system-ui,sans-serif;width:100%;max-width:1100px;margin:0 auto}
.ofh-bar{background:var(--of-ink);color:#fff;font-size:13px;font-weight:600;letter-spacing:.02em;text-align:center;padding:9px 14px;border-radius:0 0 14px 14px}
.ofh-bar b{color:var(--of-aqua)}
.ofh-cd{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:6px;background:rgba(20,200,200,.16);color:var(--of-aqua);font-variant-numeric:tabular-nums}
.ofh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 6px 6px}
.ofh-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;color:var(--of-ink)!important;text-decoration:none!important}
.ofh-logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--of-aqua),#0a6f9e);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.ofh-secure{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--of-mut)}
.ofh-secure svg{width:15px;height:15px;color:var(--of-aqua2)}
.ofh-head{text-align:center;padding:16px 6px 6px}
.ofh-head h1{margin:0;font-size:clamp(24px,4vw,34px);line-height:1.15;font-weight:800;color:var(--of-ink);letter-spacing:-.02em}
.ofh-head h1 span{color:var(--of-aqua2)}
.ofh-head p{margin:8px 0 0;font-size:15px;color:var(--of-mut)}
.ofh-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 6px}
.ofh-chips span{font-size:12.5px;font-weight:600;color:var(--of-ink2);background:#fff;border:1px solid var(--of-line);border-radius:999px;padding:6px 12px}
.ofh-chips span:before{content:"✓ ";color:var(--of-aqua2);font-weight:800}

/* order form */
.c-order-form,.c-order-form *{font-family:Inter,system-ui,sans-serif!important}
.c-order-form .order-form__surface{background:#fff!important;border:1px solid var(--of-line)!important;border-radius:20px!important;box-shadow:0 18px 50px -20px rgba(6,34,58,.28)!important;padding:28px!important}
.c-order-form .order-form__headline{font-size:22px!important;font-weight:800!important;color:var(--of-ink)!important;letter-spacing:-.01em}
.c-order-form .order-form__subheadline{font-size:0!important}
.c-order-form .order-form__subheadline:after{content:"Your details, then pick your plan.";font-size:14px;color:var(--of-mut)}
.c-order-form .order-form__label{font-size:12.5px!important;font-weight:600!important;color:var(--of-ink2)!important;margin-bottom:6px!important}
.c-order-form .order-form__input,.c-order-form .order-form__select,.c-order-form .order-form__search{background:var(--of-soft)!important;border:1.5px solid var(--of-line)!important;border-radius:11px!important;padding:12px 14px!important;font-size:15px!important;color:var(--of-ink)!important;box-shadow:none!important;transition:border-color .15s,box-shadow .15s,background .15s}
.c-order-form .order-form__input:focus,.c-order-form .order-form__search:focus-within{outline:none!important;border-color:var(--of-aqua)!important;background:#fff!important;box-shadow:0 0 0 4px rgba(20,200,200,.15)!important}
.c-order-form .order-form__search input{background:transparent!important;border:0!important;padding:0!important}

/* plan picker */
.c-order-form .order-form__product-table-head{display:none!important}
.c-order-form .order-form__prod{border:1.5px solid var(--of-line)!important;border-radius:14px!important;padding:14px 16px!important;margin:0 0 10px!important;background:#fff!important;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.c-order-form .order-form__prod:hover{border-color:#9fdfe2!important}
.c-order-form .order-form__prod--selected{border-color:var(--of-aqua)!important;background:linear-gradient(180deg,#effcfc,#fff)!important;box-shadow:0 0 0 4px rgba(20,200,200,.12)!important}
.c-order-form .order-form__prod-name{font-size:15.5px!important;font-weight:700!important;color:var(--of-ink)!important}
.c-order-form .order-form__prod-price{font-size:16px!important;font-weight:800!important;color:var(--of-aqua2)!important}
.c-order-form input[type=checkbox],.c-order-form input[type=radio]{accent-color:var(--of-aqua2)}
.c-order-form .order-form__coupon-link{color:var(--of-aqua2)!important;font-weight:600!important;font-size:13px!important}

/* summary */
.c-order-form .order-form__summary{background:var(--of-soft)!important;border-radius:14px!important;padding:14px 16px!important;border:0!important}
.c-order-form .order-form__summary-row{color:var(--of-ink2)!important;font-size:14px!important}
.c-order-form .order-form__summary-row--total{font-size:18px!important;font-weight:800!important;color:var(--of-ink)!important}

/* button */
.c-order-form .order-form__pay-head{font-weight:700!important;color:var(--of-ink)!important}
.c-order-form .order-form__cta{width:100%!important;background:linear-gradient(135deg,var(--of-aqua),var(--of-aqua2))!important;border:0!important;border-radius:14px!important;padding:17px 20px!important;box-shadow:0 12px 28px -10px rgba(15,169,176,.75)!important;transition:transform .15s,box-shadow .15s;cursor:pointer}
.c-order-form .order-form__cta,.c-order-form .order-form__cta *{color:var(--of-ink)!important;font-size:17px!important;font-weight:800!important}
.c-order-form .order-form__cta:hover{transform:translateY(-1px)}
.c-order-form .order-form__footer{color:var(--of-mut)!important;font-size:12.5px!important}
.ofh-note{font-family:Inter,system-ui,sans-serif;text-align:center;margin:12px 0 0;font-size:12.5px;color:var(--of-mut)}
@media(max-width:600px){.c-order-form .order-form__surface{padding:20px!important;border-radius:16px!important}.ofh-secure span{display:none}}
</style>

<div class="ofh">
  <div class="ofh-bar">Try any plan <b>7 days for $1</b> · Offer ends Wed, Nov 18 <span class="ofh-cd" id="ofh-cd"></span></div>
  <div class="ofh-top">
    <a class="ofh-logo" href="https://oceanicfunnels.com/"><i>≈</i>Oceanic Funnels</a>
    <div class="ofh-secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Secure checkout</span></div>
  </div>
  <div class="ofh-head">
    <h1>Start your 7-day trial for <span>$1</span></h1>
    <p>Pick your plan below. Full access from day one.</p>
    <div class="ofh-chips"><span>$1 due today</span><span>Cancel anytime</span><span>24/7 support</span></div>
  </div>
</div>

<script>
(function(){
var end=new Date('2026-11-18T23:59:59-05:00').getTime(),el=document.getElementById('ofh-cd');
function p(n){return n<10?'0'+n:n}
function t(){var d=end-Date.now();if(d<=0){el.style.display='none';return}var s=Math.floor(d/1e3);el.textContent=p(Math.floor(s/86400))+'d '+p(Math.floor(s%86400/3600))+'h '+p(Math.floor(s%3600/60))+'m '+p(s%60)+'s'}
t();setInterval(t,1000);
/* plan line under each product name + note under the button */
var after={'Growth':'7 days for $1, then $97/month','AI Pro':'7 days for $1, then $197/month · Most popular','Scale':'7 days for $1, then $297/month'};
function dress(){
  document.querySelectorAll('.order-form__prod-name').forEach(function(n){
    if(n.dataset.ofd)return;for(var k in after){if(n.textContent.indexOf(k)>-1){var s=document.createElement('span');s.textContent=after[k];s.style.cssText='display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:#5b7186';n.appendChild(s);n.dataset.ofd=1;break}}
  });
  var b=document.querySelector('.order-form__cta');
  if(b&&!document.querySelector('.ofh-note')){var d=document.createElement('p');d.className='ofh-note';d.textContent='🔒 Secure payment · $1 today · Cancel anytime before day 7 and you won’t be charged again.';b.insertAdjacentElement('afterend',d)}
}
dress();new MutationObserver(dress).observe(document.body,{childList:true,subtree:true});
})();
</script>

<!-- OCEANIC FUNNELS CHECKOUT: block 1 of 3 (top of page). Holds the page styles too. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--of-ink:#0E1A1B;--of-aqua:#3DE3C8;--of-aqua-d:#0E9C87;--of-aqua-l:#DDF7F2;--of-coral-d:#D9472A;--of-mist:#EEF5F3;--of-line:#DCE6E3;--of-muted:#5B6967}
html,body{background:radial-gradient(1000px 460px at 50% -140px,rgba(61,227,200,.30),transparent 70%),var(--of-mist)!important;background-attachment:fixed!important}
.ofc{font-family:Inter,system-ui,sans-serif;color:var(--of-ink);-webkit-font-smoothing:antialiased;box-sizing:border-box}
.ofc *,.ofc *::before,.ofc *::after{box-sizing:border-box;margin:0;padding:0}
.ofc a{color:inherit}
/* top bar */
.ofc-top{max-width:1100px;margin:0 auto;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.ofc-top img{height:34px;width:auto;display:block}
.ofc-secure{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--of-muted)}
.ofc-secure svg{width:16px;height:16px;stroke:var(--of-aqua-d)}
/* hero */
.ofc-hero{max-width:760px;margin:0 auto;padding:40px 20px 8px;text-align:center}
.ofc-eyebrow{display:inline-block;font-family:"Inter Tight",sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--of-aqua-d);background:var(--of-aqua-l);padding:7px 14px;border-radius:999px}
.ofc-hero h1{font-family:"Inter Tight",sans-serif;font-weight:800;font-size:clamp(34px,5.4vw,58px);line-height:1.02;letter-spacing:-.035em;margin-top:18px;color:var(--of-ink)}
.ofc-hero h1 span{color:var(--of-aqua-d)}
.ofc-hero p{font-size:18px;line-height:1.6;color:var(--of-muted);margin-top:16px}
.ofc-trust{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;margin-top:22px;list-style:none}
.ofc-trust li{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;color:var(--of-ink)}
.ofc-trust li::before{content:"\2713";width:20px;height:20px;border-radius:50%;background:var(--of-aqua);color:var(--of-ink);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
/* side panel */
.ofc-side{background:var(--of-ink);color:#fff;border-radius:22px;padding:32px 30px;position:relative;overflow:hidden}
.ofc-side::after{content:"";position:absolute;right:-30px;top:-30px;width:26%;height:80px;background:repeating-linear-gradient(135deg,rgba(61,227,200,.22) 0 2px,transparent 2px 10px);border-radius:0 0 0 40px;pointer-events:none}
.ofc-side h2{font-family:"Inter Tight",sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em;color:#fff;position:relative}
.ofc-side .ofc-lead{position:relative;max-width:85%;color:#A9B9B6;font-size:15px;line-height:1.55;margin-top:8px}
.ofc-list{list-style:none;display:grid;gap:13px;margin-top:22px}
.ofc-list li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.45;color:#E6EEEC}
.ofc-list li::before{content:"\2713";width:22px;height:22px;border-radius:50%;background:var(--of-aqua);color:var(--of-ink);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.ofc-list b{color:#fff;font-weight:600}
.ofc-guarantee{margin-top:26px;padding:18px;border:1px solid #2A3A3A;border-radius:16px;display:flex;gap:14px;align-items:flex-start}
.ofc-guarantee svg{width:34px;height:34px;flex:none;stroke:var(--of-aqua)}
.ofc-guarantee b{display:block;font-family:"Inter Tight",sans-serif;font-size:16px;color:#fff}
.ofc-guarantee span{display:block;font-size:13.5px;line-height:1.5;color:#A9B9B6;margin-top:3px}
.ofc-help{margin-top:18px;font-size:14px;color:#A9B9B6}
.ofc-help a{color:var(--of-aqua);text-decoration:none;font-weight:600}
/* footer */
.ofc-foot{max-width:1100px;margin:0 auto;padding:28px 20px 40px;border-top:1px solid var(--of-line);display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--of-muted)}
.ofc-foot nav{display:flex;gap:20px}
.ofc-foot a{color:var(--of-muted);text-decoration:none}
.ofc-foot a:hover{color:var(--of-ink)}
@media (max-width:640px){
  .ofc-top{padding:16px}
  .ofc-top img{height:28px}
  .ofc-secure span{display:none}
  .ofc-hero{padding:22px 16px 0}
  .ofc-hero p{font-size:16px}
  .ofc-trust{gap:8px 16px}
  .ofc-side{padding:26px 20px;border-radius:18px}
  .ofc-foot{justify-content:center;text-align:center}
}
</style>

<div class="ofc">
  <header class="ofc-top">
    <a href="https://oceanicfunnels.com/"><img src="https://oceanicfunnels.com/assets/logo-light.svg" alt="Oceanic Funnels" width="173" height="34"></a>
    <span class="ofc-secure"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Secure checkout</span></span>
  </header>
  <section class="ofc-hero">
    <span class="ofc-eyebrow">Oceanic Funnels OS</span>
    <h1>You're one step from <span>your net.</span></h1>
    <p>Funnels, CRM, email, SMS, AI agents, booking and payments in one system. Start today, cancel anytime.</p>
    <ul class="ofc-trust">
      <li>Unlimited contacts and users</li>
      <li>Unlimited funnels</li>
      <li>No contracts, cancel anytime</li>
    </ul>
  </section>
</div>

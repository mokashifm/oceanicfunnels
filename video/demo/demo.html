<script src="icons.js"></script>
<script>
const ic=(n,s=20,w=2,st='')=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" stroke-width="${w}" style="${st}">${ICONS[n]||''}</svg>`;
const $=(s,r=document)=>r.querySelector(s);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const oo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const P=(t,a,b,e=io)=>e(cl((t-a)/(b-a)));
const L=(a,b,p)=>a+(b-a)*p;

function sidebar(active){

  return `<div class="sbar"><div class="lg"><img src="icon.svg"></div><div class="tg">${ic('chevron-down',11,3,'transform:rotate(-90deg)')}</div>

  ${ys.map(([y,n])=>{const on=(active=='sites'&&n=='app-window')||(active=='pay'&&n=='receipt');return `<div class="it ${on?'on':''}" style="top:${y-19}px;height:38px">${ic(n,21,1.8)}</div>`}).join('')}</div>`;
}
function topbar(){return `<div class="tbar"><div class="band"></div><div class="ri"><span>${ic('phone',18,2)}</span><span class="k">${ic('sparkles',18,2)}</span><span>${ic('megaphone',18,2)}</span><span class="n">${ic('bell',18,2)}</span><span>${ic('circle-help',18,2)}</span><img src="icon.svg"></div></div>`}
function sitesNav(){return `<div class="nav"><h3>Sites</h3>${['Funnels','Websites','Stores','Webinars','Analytics','Blogs','WordPress','Client Portal','Forms','Surveys','Quizzes','Chat Widget','QR Codes'].map((x,i)=>`<span class="${i==0?'on':''}">${x}${x=='Client Portal'?ic('chevron-down',16):''}</span>`).join('')}<span class="gear">${ic('settings',22,1.8)}</span></div>`}
function payNav(){return `<div class="nav"><h3>Payments</h3>${['Transactions','Subscriptions','Orders','Payment Links','Products','Coupons','Settings','Integrations'].map((x,i)=>`<span class="${i==0?'on':''}">${x}</span>`).join('')}</div>`}

let CUR=[],CLICKS=[],CAPS=[];
function rc(sel,dx=0,dy=0,ax=.5,ay=.5){const e=typeof sel=='string'?$(sel):sel;const r=e.getBoundingClientRect();return [r.left+r.width*ax+dx,r.top+r.height*ay+dy]}
function kpos(k){return k.s?rc(k.s,k.dx||0,k.dy||0,k.ax??.5,k.ay??.5):[k.x,k.y]}
function curAt(t){
  if(!CUR.length)return null;
  if(t<=CUR[0].t)return kpos(CUR[0]);
  for(let i=1;i<CUR.length;i++){const a=CUR[i-1],b=CUR[i];if(t<=b.t){const p=io((t-a.t)/(b.t-a.t));const A=kpos(a),B=kpos(b);return [L(A[0],B[0],p),L(A[1],B[1],p)]}}
  return kpos(CUR[CUR.length-1]);
}
function drawCursor(t){
  const c=curAt(t),cur=$('#cur'),ring=$('#ring');
  if(!c){cur.style.opacity=0;ring.style.opacity=0;return}
  let s=1;for(const k of CLICKS){const d=t-k;if(d>=0&&d<.22)s=1-.15*Math.sin(Math.PI*d/.22)}
  cur.style.opacity=1;cur.style.transform=`translate(${c[0]-2}px,${c[1]-1}px) scale(${s})`;
  let ro=0,rs=.3;for(const k of CLICKS){const d=t-k;if(d>=0&&d<.45){ro=1-d/.45;rs=.3+d/.45}}
  ring.style.opacity=ro;ring.style.left=c[0]+'px';ring.style.top=c[1]+'px';ring.style.transform=`scale(${rs})`;
}
function drawCap(t){
  const cap=$('#cap');let o=0;
  for(const c of CAPS){if(t>=c.a-.3&&t<=c.b+.3){o=Math.min(P(t,c.a-.3,c.a,oo),1-P(t,c.b,c.b+.3));$('i',cap).textContent=c.n;$('span',cap).textContent=c.txt}}
  cap.style.opacity=o;cap.style.transform=`translateX(-50%) translateY(${(1-o)*20}px)`;
}
function fades(t,dur,fi=.4,fo=.4){$('#fade').style.opacity=Math.max(fi?1-P(t,0,fi,oo):0,fo?P(t,dur-fo,dur):0)}
function typeText(t,a,b,str){return str.slice(0,Math.round(cl((t-a)/(b-a))*str.length))}

const SC={};

const HP=[[0.35,1.272],[1.622,3.218],[3.298,4.381],[4.501,6.528],[6.578,7.633],[7.983,9.449],[9.699,10.987],[11.187,13.014],[13.074,14.266],[14.616,16.012],[16.212,18.47],[18.53,19.454],[19.654,22.078],[22.378,23.874],[24.124,25.629]];
const HT=['Oh, you *made *it.','Listen, you are a *business *owner','or an *entrepreneur,','or you want to create a *digital *product','and *sell *it *online.','You landed at the *right *place.','You need to start *right *now.','The price goes up on *November *20,','so you want to *hurry *up.','Make sure you *sign *up right now.','Pick a *template, let *AI build your page,','and hit *publish.','So you can start *taking *payments today.','',"I can't wait to see what you *build."];
// groups of lines shown together: [lineIdx...], layout: 'c' center or 't' top (visual below)
const HG=[[[0],'c'],[[1,2,3,4],'c'],[[5,6],'c'],[[7,8],'t'],[[9,10,11],'t'],[[12],'t'],[[13],'big'],[[14],'c']];
SC.hook={dur:26.6,build(){
  const flt=[['img/mindset-full.webp',-90,170,-8],['img/page.jpg',1710,130,7],['img/salon-seo-full.webp',-80,640,6],['img/sales-coach-full.webp',1720,610,-6]];
  let lines='';
  HG.forEach(([ids,lay],g)=>{if(lay=='big')return;
    lines+=`<div class="txt ${g==1||g==2?'n':''}" id="g${g}" style="${lay=='t'?'top:330px':''}">`+ids.map(i=>`<div class="ln ${ids.length>2||lay=='t'?'s':''}" id="l${i}">`+HT[i].split(' ').map(w=>`<span class="w ${w[0]=='*'?'h':''}">${w.replace('*','')}</span>`).join(' ')+`</div>`).join('')+`</div>`});
  $('#cam').innerHTML=`<div class="hk"><div class="grid"></div>
   ${flt.map((f,i)=>`<div class="flt" id="f${i}" style="left:${f[1]}px;top:${f[2]}px;transform:rotate(${f[3]}deg)"><img src="${f[0]}"></div>`).join('')}
   <img class="lg" id="hlg" src="img/logo.svg">
   ${lines}
   <div class="price" id="price"><div class="now"><small>TODAY</small><b>$17</b><small>per month</small></div><div class="ar">→</div><div class="then"><b>$37</b><small>from Nov 20</small></div></div>

   <div class="pbtn" id="hpub">${ic('send',28,2.2)} Publish</div>
   <div class="txs" id="txs">${[['Emma Collins','#9B7EC8','Starter Kit',49],['Daniel Reyes','#C47BB5','Career Planning Kit',97],['Marcus Lee','#6BBF7A','Business Relationship',197]].map(r=>`<div class="r"><span class="cu"><span class="av" style="background:${r[1]}">${r[0].split(' ').map(w=>w[0]).join('')}</span>${r[0]}</span><span>${r[2]}</span><b>$${r[3]}.00</b><span class="ok">Succeeded</span></div>`).join('')}</div>
   <div class="big" id="big"><b>$17</b><span>/month</span><p>Price goes up to $37 on November 20</p></div>
  </div>`;
  CUR=[];CLICKS=[];CAPS=[];
},tick(t){
  // group visibility
  HG.forEach(([ids,lay],g)=>{
    const a=HP[ids[0]][0]-.15, last=ids[ids.length-1]; const nextG=HG[g+1]; const end=nextG?HP[nextG[0][0]][0]-.2:99;
    const o=P(t,a,a+.2)*(1-P(t,end-.05,end+.15));
    if(lay=='big'){const b=$('#big');b.style.opacity=o;b.style.transform=`translateY(-50%) scale(${L(.85,1,P(t,a,a+.35,back))})`;return}
    const el=$('#g'+g);el.style.opacity=o;
    ids.forEach(i=>{const [s0,e0]=HP[i];const ws=[...$('#l'+i).querySelectorAll('.w')];const n=ws.length;
      ws.forEach((w,k)=>{const wt=s0+(e0-s0)*k/n-.05;const p=P(t,wt,wt+.22,oo);w.style.opacity=p;w.style.transform=`translateY(${(1-p)*28}px)`;
        if(w.classList.contains('h'))w.style.setProperty('--u',P(t,wt+.15,wt+.45,oo))})});
  });
  // floating real funnels (lines 1-6)
  [0,1,2,3].forEach(i=>{const f=$('#f'+i);const a=1.5+i*.35;const o=P(t,a,a+.5)*(1-P(t,10.8,11.2));f.style.opacity=o*.9;
    const r=[-8,7,6,-6][i];f.style.transform=`translateY(${(1-P(t,a,a+.7,oo))*60+Math.sin(t*.8+i)*8}px) rotate(${r}deg)`});
  $('#hlg').style.opacity=P(t,.1,.5)*(1-P(t,11,11.3))+P(t,24,24.4);
  // price
  const pr=$('#price'),po=P(t,11.6,11.95)*(1-P(t,14.3,14.5));pr.style.opacity=po;pr.style.transform=`translateX(-50%) scale(${L(.9,1,P(t,11.6,12,back))})`;
  $('.hk .then').style.transform=`scale(${1+.04*Math.sin(Math.max(0,t-12.5)*9)*(t>12.5&&t<13.5?1:0)})`;
  // templates + publish
  const tp=[...$('#tpls').children];tp.forEach((c,i)=>{const a=16.2+i*.22;const p=P(t,a,a+.4,oo);c.style.opacity=p*(1-P(t,19.45,19.65));c.style.transform=`translateY(${(1-p)*50}px)`;

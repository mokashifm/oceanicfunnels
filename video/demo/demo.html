function chrome(active, inner){

/* cursor & caption helpers */
let CUR=[], CLICKS=[], CAPS=[];
function center(el,dx=0,dy=0){const r=el.getBoundingClientRect();return [r.left+r.width/2+dx,r.top+r.height/2+dy]}
function curAt(t){
  if(!CUR.length) return null;
  if(t<=CUR[0].t) return [CUR[0].x,CUR[0].y];
  for(let i=1;i<CUR.length;i++){const a=CUR[i-1],b=CUR[i];if(t<=b.t){const p=io((t-a.t)/(b.t-a.t));return [L(a.x,b.x,p),L(a.y,b.y,p)]}}
  const z=CUR[CUR.length-1];return [z.x,z.y];
}
function drawCursor(t){
  const c=curAt(t), cur=$('#cur'), ring=$('#ring');
  if(!c){cur.style.opacity=0;ring.style.opacity=0;return}
  let s=1;for(const k of CLICKS){const d=t-k; if(d>=0&&d<.25) s=1-.18*Math.sin(Math.PI*d/.25)}
  cur.style.opacity=1;cur.style.transform=`translate(${c[0]-3}px,${c[1]-2}px) scale(${s})`;
  let ro=0,rs=.4;for(const k of CLICKS){const d=t-k;if(d>=0&&d<.5){ro=1-d/.5;rs=.4+d/.5*1.1}}
  ring.style.opacity=ro;ring.style.left=c[0]+'px';ring.style.top=c[1]+'px';ring.style.transform=`scale(${rs})`;
}
function drawCap(t){
  const cap=$('#cap');let o=0;
  for(const c of CAPS){ if(t>=c.a-.3&&t<=c.b+.3){ o=Math.min(P(t,c.a-.3,c.a,oo),1-P(t,c.b,c.b+.3)); $('i',cap).textContent=c.n; $('span',cap).textContent=c.txt; } }
  cap.style.opacity=o; cap.style.transform=`translateX(-50%) translateY(${(1-o)*24}px)`;
}
function fades(t,dur,fin=.45,fout=.45){ $('#fade').style.opacity = Math.max(1-P(t,0,fin,oo), P(t,dur-fout,dur)) }

    r.style.transform=`translateY(${y}px)`;r.style.opacity=i==newest?P(t,T[i],T[i]+.3):1;
    r.style.background=(i==newest&&t-T[i]<.9)?`rgba(61,227,200,${.28*(1-cl((t-T[i])/.9))})`:'#fff';});
  // counters (smooth)
  let shownRev=0;T.forEach((a,i)=>{shownRev+=N[i][2]*P(t,a,a+.5)});
  $('#rev').textContent='$'+shownRev.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  $('#ord').textContent=shown;$('#conv').textContent=(shown?L(3.1,5.4,shown/8):0).toFixed(1)+'%';
  const newest=T.reduce((m,a,i)=>t>=a?i:m,-1);const to=$('#toast');
  if(newest>=0){const d=t-T[newest];to.style.opacity=cl(d/.15)*(d<.85?1:1-cl((d-.85)/.2));to.style.transform=`translateY(${(1-P(d,0,.3,back))*-24}px)`;$('#tb').textContent=`New sale · $${N[newest][2]}.00`;$('#ts').textContent=`${N[newest][3]} · just now`}else to.style.opacity=0;
  fades(t,this.dur);
}};

SC.outro={dur:4.6,build(){
  $('#stage').innerHTML=`<div class="center"><div class="bigl" style="width:120px;height:120px">${LOGO}</div><h1>Build it. Launch it.<br><em>Get paid.</em></h1><div class="go">Start building for $17/month →</div><div class="url">oceanicfunnels.com</div></div>`;
  CUR=[];CLICKS=[];CAPS=[];
},tick(t){
  $('.bigl').style.opacity=P(t,.1,.5);$('.center h1').style.opacity=P(t,.3,.8);$('.center h1').style.transform=`translateY(${(1-P(t,.3,.9,oo))*30}px)`;
  const g=$('.go'),p=P(t,.9,1.4,back);g.style.opacity=cl((t-.9)/.25);g.style.transform=`scale(${L(.85,1,p)*(1+.025*Math.sin(Math.max(0,t-1.6)*4))})`;
  $('.url').style.opacity=P(t,1.4,1.9);
  fades(t,this.dur,.45,.5);
}};

let CURSC=null;
window.setup=name=>{CURSC=SC[name];CUR=[];CLICKS=[];CAPS=[];CURSC.build();return CURSC.dur};
window.render=t=>{CURSC.tick(t);drawCursor(t);drawCap(t)};
</script></body></html>

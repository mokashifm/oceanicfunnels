<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
body{width:1280px;height:800px;background:#F7F2EA;color:#2B2622}

.k{font-size:14px;color:#8A7F74;font-weight:600}
h1{font-family:DMSerif;font-weight:400;font-size:64px;line-height:1;margin-top:10px}
.pr{font-size:30px;font-weight:700;margin-top:18px}
p.s{font-size:18px;line-height:1.6;color:#5F574F;margin-top:16px}
.sw{display:flex;gap:12px;margin-top:22px;align-items:center}.sw b{font-size:14px;margin-right:6px}.sw i{width:34px;height:34px;border-radius:50%;border:3px solid #F7F2EA;box-shadow:0 0 0 2px transparent}.sw i.on{box-shadow:0 0 0 2px #2B2622}
.add{margin-top:28px;background:#2B2622;color:#fff;text-align:center;font-weight:700;font-size:18px;padding:18px;border-radius:14px}
.ship{margin-top:14px;font-size:14.5px;color:#6A625A;text-align:center}

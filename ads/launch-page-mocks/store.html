<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
body{width:1280px;height:800px;background:#F6F3EE;color:#22201C}
nav{display:flex;justify-content:space-between;align-items:center;padding:24px 56px;border-bottom:1px solid #E4DED4}
.lg{font-family:DMSerif;font-size:30px}
nav div span{font-size:15px;color:#5F5A51;margin-left:28px}nav .cart{background:#22201C;color:#fff;border-radius:99px;padding:8px 16px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:end;padding:36px 56px 0}
h1{font-family:DMSerif;font-weight:400;font-size:54px;line-height:1}.top p{color:#6A645A;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:28px 56px}
.c{background:#fff;border-radius:16px;overflow:hidden}
.ph{height:250px;display:grid;place-items:center;position:relative}
.c .meta{padding:14px 16px 18px}.c b{display:block;font-size:16px}.c span{font-size:15px;color:#6A645A}
.mug{width:120px;height:130px;border-radius:12px 12px 36px 36px;position:relative}
.mug::after{content:"";position:absolute;right:-38px;top:28px;width:44px;height:58px;border:14px solid;border-color:inherit;border-radius:0 30px 30px 0;border-left:0}
.bowl{width:170px;height:84px;border-radius:0 0 90px 90px}
.vase{width:90px;height:170px;border-radius:40px 40px 50px 50px}
.plate{width:170px;height:170px;border-radius:50%}
.badge{position:absolute;top:14px;left:14px;background:#22201C;color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px}
</style></head><body>
<nav><div class="lg">Clay &amp; Co.</div><div><span>Shop</span><span>Collections</span><span>About</span><span class="cart">Cart (2)</span></div></nav>
<div class="top"><h1>Handmade for everyday</h1><p>Small-batch ceramics, made to order</p></div>
<div class="grid">
<div class="c"><div class="ph" style="background:#E9DCCB"><span class="badge">Bestseller</span><div class="mug" style="background:#C8735A;border-color:#C8735A"></div></div><div class="meta"><b>Morning Mug</b><span>$32</span></div></div>
<div class="c"><div class="ph" style="background:#DCE4DA"><div class="bowl" style="background:#6E8B6B"></div></div><div class="meta"><b>Salad Bowl</b><span>$48</span></div></div>
<div class="c"><div class="ph" style="background:#E6E0EE"><div class="vase" style="background:#8C7AA8"></div></div><div class="meta"><b>Bud Vase</b><span>$40</span></div></div>
<div class="c"><div class="ph" style="background:#F0E3C9"><div class="plate" style="background:radial-gradient(circle,#F7F1E6 0 55%,#D6A85A 56%)"></div></div><div class="meta"><b>Dinner Plate</b><span>$36</span></div></div>
<div class="c"><div class="ph" style="background:#DDE7EC"><div class="vase" style="background:#5C7F94;height:140px"></div></div><div class="meta"><b>Pitcher</b><span>$54</span></div></div>
<div class="c"><div class="ph" style="background:#F2DCD6"><div class="mug" style="background:#B85C6A;border-color:#B85C6A"></div></div><div class="meta"><b>Tea Cup</b><span>$28</span></div></div>
<div class="c"><div class="ph" style="background:#E3E8D6"><div class="bowl" style="background:#9AA86A;width:130px;height:64px"></div></div><div class="meta"><b>Cereal Bowl</b><span>$30</span></div></div>
<div class="c"><div class="ph" style="background:#EFE6DA"><div class="plate" style="background:radial-gradient(circle,#F7F1E6 0 55%,#8C7A64 56%);width:140px;height:140px"></div></div><div class="meta"><b>Side Plate</b><span>$26</span></div></div>
</div></body></html>

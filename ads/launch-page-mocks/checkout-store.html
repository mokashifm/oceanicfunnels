<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
body{width:390px;height:780px;background:#fff;color:#1C1A17;padding:58px 22px 0}
.lg{font-family:DMSerif;font-size:24px}.lg i{font-style:normal}
h2{font-size:24px;font-weight:700;margin-top:22px;letter-spacing:-.02em}

.pay{margin-top:18px;background:#22201C;color:#fff;text-align:center;font-weight:700;font-size:17px;padding:17px;border-radius:14px}
.sec{text-align:center;font-size:12.5px;color:#8A7A6B;margin-top:12px}
</style></head><body>
<div class="lg">Clay &amp; Co.</div>

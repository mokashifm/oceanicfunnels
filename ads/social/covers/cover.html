<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--ink:#0E1A1B;--aqua:#3DE3C8;--coral:#FF7657;--mist:#C9D6D4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",sans-serif;background:var(--ink);overflow:hidden;position:relative}
.d{font-family:"Inter Display","Inter",sans-serif}
.bg{position:absolute;inset:0;background:
  radial-gradient(60% 90% at 78% 55%,rgba(61,227,200,.22),rgba(61,227,200,0) 70%),
  radial-gradient(40% 70% at 12% 0%,rgba(95,200,232,.12),rgba(95,200,232,0) 70%),
  linear-gradient(180deg,#0E1A1B,#0B1617)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(70% 90% at 70% 50%,#000,transparent)}
.wrap{position:absolute;display:flex;align-items:center}
.tx img{display:block}
.tx h1{color:#fff;letter-spacing:-.035em;line-height:1.02}
.tx h1 span{color:var(--aqua);display:block}
.tx p{color:var(--mist)}
.chips{display:flex;flex-wrap:wrap}
.chips span{border:1px solid rgba(255,255,255,.16);color:#E3ECEA;border-radius:99px;font-weight:600;background:rgba(255,255,255,.04)}
.url{display:inline-block;background:var(--aqua);color:var(--ink);font-weight:700;border-radius:99px}
.dev{position:absolute;display:block}
/* FACEBOOK 1640x624 (2x of 820x312); mobile shows centre ~1110px */
body.fb{width:1640px;height:624px}
.fb .wrap{left:330px;top:0;height:624px;width:540px}
.fb .tx img{width:220px;margin-bottom:22px}
.fb .tx h1{font-size:54px}
.fb .tx p{font-size:20px;line-height:1.45;margin-top:16px;max-width:500px}
.fb .chips{gap:8px;margin-top:20px}.fb .chips span{font-size:14.5px;padding:7px 12px}
.fb .url{font-size:17px;padding:10px 20px;margin-top:22px}
.fb .dev{left:860px;top:120px;width:520px}
/* LINKEDIN 1512x256 -> rendered 2x 3024x512 */
body.li{width:1512px;height:256px}
.li .wrap{left:330px;top:0;height:256px;width:620px}
.li .tx img{width:150px;margin-bottom:12px}
.li .tx h1{font-size:34px}
.li .tx p{font-size:14.5px;line-height:1.4;margin-top:9px}
.li .url{font-size:13px;padding:7px 14px;margin-top:12px}
.li .dev{left:930px;top:-6px;width:430px}
</style></head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="wrap"><div class="tx">
  <img src="logo-dark.svg" alt="">
  <h1 class="d">Every lead answered.<span>Every call booked.</span></h1>
  <p>Funnels, CRM, AI agents, booking and payments in one system, so no enquiry goes cold.</p>
  <div class="chips"><span>AI agents 24/7</span><span>Bookings with deposits</span><span>Missed call text back</span></div>
  <span class="url">oceanicfunnels.com</span>
</div></div>
<img class="dev" src="devices-hi.png" alt="">
<script>
const m=location.hash.slice(1)||'fb';document.body.className=m;
if(m==='li'){document.querySelector('.chips').remove()}
</script>
</body></html>
